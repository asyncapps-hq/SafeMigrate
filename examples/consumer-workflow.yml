name: Example SafeMigrate

on:
  pull_request:

jobs:
  shadow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci || npm install
      - run: npm run build
      - name: SafeMigrate demo
        uses: ./
        with:
          mode: demo
          step: true
      - uses: actions/upload-artifact@v4
        with:
          name: safemigrate-artifacts
          path: .safemigrate/
